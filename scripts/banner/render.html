<!doctype html>
<meta charset="utf-8">
<body style="margin:0">
<canvas id="c"></canvas>
<script>
// Static render of the Minerva site's mercury background (assets/js/mercury-bg.js):
// 2D metaballs shaded as a chrome height field and drawn as ASCII, recoloured silver for HgRT.
// Params: w,h (css px), scale, theme=light|dark, bg (css colour or "none"), kind=banner|social, t (seconds)
async function render(o) {
  var W = o.w, H = o.h, S = o.scale || 2, dark = o.theme === 'dark', t = o.t || 7.3;
  var cv = document.getElementById('c'); cv.width = W * S; cv.height = H * S;
  var ctx = cv.getContext('2d');
  if (o.bg && o.bg !== 'none') { ctx.fillStyle = o.bg; ctx.fillRect(0, 0, cv.width, cv.height); }
  var px = o.cell || 9, RAMP = ' .,:-=+*oO%#@';
  ctx.font = (px * S) + 'px "DejaVu Sans Mono", Menlo, Consolas, monospace'; ctx.textBaseline = 'top';
  var cw = ctx.measureText('MMMMMMMMMM').width / 10 / S, ch = px * 1.08;
  var cols = Math.ceil(W / cw), rows = Math.ceil(H / ch);
  // blobs placed in px for this canvas: [x, y, r]
  var b = o.balls.map(function (q) { return [q[0] * W, q[1] * H, q[2] * Math.min(W, H)]; });
  function field(x, y) { var f = 0; for (var i = 0; i < b.length; i++) { var dx = x - b[i][0], dy = y - b[i][1]; f += b[i][2] * b[i][2] / (dx * dx + dy * dy + 1); } return f; }
  var s = Math.min(W, H), lx = 0.55 * Math.cos(t * 0.35), ly = -0.6, lz = 0.6, ll = Math.hypot(lx, ly, lz); lx /= ll; ly /= ll; lz /= ll;
  var e = cw, R = s * 0.11, levels = 6, buckets = []; for (var j = 0; j <= levels; j++) buckets.push([]);
  for (var rr = 0; rr < rows; rr++) { var py = (rr + 0.5) * ch;
    for (var c = 0; c < cols; c++) { var x = (c + 0.5) * cw, f = field(x, py); if (f < 0.92) continue;
      var z0 = Math.sqrt(Math.max(0, 1 - 1 / f)), zx = Math.sqrt(Math.max(0, 1 - 1 / field(x + e, py))), zy = Math.sqrt(Math.max(0, 1 - 1 / field(x, py + e)));
      var nx = -(zx - z0) / e * R, ny = -(zy - z0) / e * R;
      nx += 0.18 * Math.sin(x * 0.021 + py * 0.007 + t * 1.7); ny += 0.18 * Math.cos(py * 0.026 - x * 0.006 - t * 1.3);
      var nz = 1, nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
      var ry = 2 * nz * ny, rx = 2 * nz * nx, env = 0.5 + 0.5 * Math.sin(ry * 7 + rx * 2.5 + t * 0.6);
      env = ry < 0 ? 0.35 + 0.55 * env : 0.12 + 0.25 * env;
      var fres = Math.pow(1 - nz, 2) * 0.35, spec = Math.pow(Math.max(0, nx * lx + ny * ly + nz * lz), 28);
      var v = Math.min(1, 0.1 + env * 0.7 + fres + spec * 0.8);
      if (f < 1) v *= (f - 0.92) / 0.08 * 0.6;
      // keep the logotype area quieter
      if (o.clear) { var cx = o.clear; var d = Math.hypot((x - cx[0] * W) / (cx[2] * W), (py - cx[1] * H) / (cx[3] * H)); if (d < 1) v *= 0.25 + 0.75 * d * d; }
      var k = Math.round(v * levels); if (k <= 0) continue; buckets[k].push(c, rr, v); } }
  var ink = dark ? '#9aa4ae' : '#6b7580', hi = dark ? '#f4f7fa' : '#2b3138';
  for (var L = 1; L <= levels; L++) { var a = buckets[L], top = L >= levels;
    ctx.fillStyle = top ? hi : ink; ctx.globalAlpha = (top ? 0.9 : 0.28 + 0.62 * L / levels) * (o.inkAlpha || 1);
    for (var n = 0; n < a.length; n += 3) { var g = RAMP[Math.min(RAMP.length - 1, Math.round(a[n + 2] * (RAMP.length - 1)))]; ctx.fillText(g, a[n] * cw * S, a[n + 1] * ch * S); } }
  ctx.globalAlpha = 1;
  // logotype (HgRT repo's own docs/assets/hgrt-*.svg)
  if (o.logo) { var img = new Image(); img.src = o.logo.src; await img.decode();
    var lw = o.logo.w, lh = lw * img.naturalHeight / img.naturalWidth; ctx.drawImage(img, o.logo.x * S, o.logo.y * S, lw * S, lh * S); }
  ctx.textBaseline = 'alphabetic';
  (o.texts || []).forEach(function (tx) { ctx.font = tx.font.replace(/(\d+)px/, function (m, p) { return (p * S) + 'px'; }); ctx.fillStyle = tx.color; ctx.globalAlpha = tx.alpha || 1; ctx.fillText(tx.text, tx.x * S, tx.y * S); });
  ctx.globalAlpha = 1;
  return cv.toDataURL('image/png');
}
</script>
