# Build the sdist + wheel and upload them with PyPI trusted publishing (no stored token). Manual: Actions -> publish ->
# Run workflow -> target testpypi or pypi. One-time setup on (test.)pypi.org: add a trusted publisher for project
# "hgrt" with owner Minerva-Laboratories, repository HgRT, workflow publish.yml, environment = the target name.
name: publish
on:
  workflow_dispatch:
    inputs:
      target:
        description: "testpypi or pypi"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  upload:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
